name: CI-CD

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit ruff cyclonedx-bom

      - name: Generate SBOM
        continue-on-error: true
        run: |
          cyclonedx-py requirements requirements.txt -o sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Lint gate
        run: |
          python -m ruff check app tests --select E9,F63,F7,F82

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///./data/healthbuddy_test.db"
          GROQ_API_KEY: ""
          OPENAI_API_KEY: ""
          REDIS_URL: ""
          REQUIRE_TOS_ACCEPTANCE: "false"
          ENVIRONMENT: "development"
          PRELOAD_VECTOR_STORE_ON_STARTUP: "false"
          PRELOAD_MODELS_ON_STARTUP: "false"
          DB_AUTO_CREATE_ON_STARTUP: "true"
          DB_RUN_MIGRATIONS_ON_STARTUP: "false"
          STARTUP_PROVIDER_CONNECTIVITY_CHECK: "false"
        run: |
          mkdir -p data
          python -m pytest tests -v --tb=short --ignore=tests/test_e2e_browser.py 2>&1 | tee test_results.log

      - name: Report test failure
        if: failure()
        run: |
          echo "### Pytest Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 test_results.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Security scan (Bandit)
        run: |
          python -m bandit -r app -x tests -ll

      - name: Dependency vulnerability scan
        continue-on-error: true
        run: |
          pip-audit

  build-image:
    runs-on: ubuntu-latest
    needs: test-and-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t healthbuddy-ai:${{ github.sha }} .

      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@v0.28.0
        continue-on-error: true
        with:
          image-ref: healthbuddy-ai:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "0"

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Start API
        env:
          DATABASE_URL: "sqlite:///./data/healthbuddy_smoke.db"
          GROQ_API_KEY: ""
          OPENAI_API_KEY: ""
          REDIS_URL: ""
          ENVIRONMENT: "development"
          REQUIRE_TOS_ACCEPTANCE: "false"
          PRELOAD_VECTOR_STORE_ON_STARTUP: "false"
          PRELOAD_MODELS_ON_STARTUP: "false"
          DB_AUTO_CREATE_ON_STARTUP: "true"
          DB_RUN_MIGRATIONS_ON_STARTUP: "false"
          STARTUP_PROVIDER_CONNECTIVITY_CHECK: "false"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/live && echo "Server ready" && break || sleep 2
          done

      - name: Smoke checks (health/chat/auth)
        run: |
          python tests/smoke_post_deploy.py

      - name: Clinical benchmark gate
        continue-on-error: true
        env:
          QUALITY_GATE_PROFILE: baseline
        run: |
          python evaluation/quality_benchmark.py --base-url http://127.0.0.1:8000 --test-data ./evaluation/clinical_benchmark_gold.json --output ./evaluation/clinical_quality_report.json --timeout 120
          python evaluation/quality_gate.py --report ./evaluation/clinical_quality_report.json --profile-file ./evaluation/threshold_profiles.json --threshold-file ./evaluation/thresholds_clinical.json

      - name: Language benchmark gates (HI/ES/AR)
        continue-on-error: true
        env:
          QUALITY_GATE_PROFILE: baseline
        run: |
          python evaluation/quality_benchmark.py --base-url http://127.0.0.1:8000 --test-data ./evaluation/test_queries_hi.json --output ./evaluation/quality_report_hi.json --timeout 120
          python evaluation/quality_gate.py --report ./evaluation/quality_report_hi.json --profile-file ./evaluation/threshold_profiles.json --threshold-file ./evaluation/thresholds_hi.json
          python evaluation/quality_benchmark.py --base-url http://127.0.0.1:8000 --test-data ./evaluation/test_queries_es.json --output ./evaluation/quality_report_es.json --timeout 120
          python evaluation/quality_gate.py --report ./evaluation/quality_report_es.json --profile-file ./evaluation/threshold_profiles.json --threshold-file ./evaluation/thresholds_es.json
          python evaluation/quality_benchmark.py --base-url http://127.0.0.1:8000 --test-data ./evaluation/test_queries_ar.json --output ./evaluation/quality_report_ar.json --timeout 120
          python evaluation/quality_gate.py --report ./evaluation/quality_report_ar.json --profile-file ./evaluation/threshold_profiles.json --threshold-file ./evaluation/thresholds_ar.json

      - name: Clinical KPI release gate
        continue-on-error: true
        run: |
          python evaluation/gate_clinical_kpis.py --report ./evaluation/clinical_quality_report.json --thresholds ./evaluation/clinical_kpi_thresholds.json

      - name: Fairness and adversarial checks
        continue-on-error: true
        run: |
          python evaluation/evaluate_fairness.py --base-url http://127.0.0.1:8000 --cases ./evaluation/fairness_cases.json --output ./evaluation/fairness_report.json
          python evaluation/evaluate_adversarial.py --base-url http://127.0.0.1:8000 --cases ./evaluation/adversarial_redteam_cases.json --output ./evaluation/adversarial_report.json

  browser-e2e:
    runs-on: ubuntu-latest
    needs: test-and-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Create data directory
        run: mkdir -p data

      - name: Start API for E2E
        env:
          DATABASE_URL: "sqlite:///./data/healthbuddy_e2e_ci.db"
          GROQ_API_KEY: ""
          OPENAI_API_KEY: ""
          REDIS_URL: ""
          ENVIRONMENT: "development"
          REQUIRE_TOS_ACCEPTANCE: "false"
          PRELOAD_VECTOR_STORE_ON_STARTUP: "false"
          PRELOAD_MODELS_ON_STARTUP: "false"
          DB_AUTO_CREATE_ON_STARTUP: "true"
          DB_RUN_MIGRATIONS_ON_STARTUP: "false"
          STARTUP_PROVIDER_CONNECTIVITY_CHECK: "false"
          ADMIN_USERNAMES: "admin"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8010 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8010/api/live && echo "E2E server ready" && break || sleep 2
          done

      - name: Run browser E2E tests
        id: e2e_step
        env:
          RUN_E2E: "1"
          ADMIN_USERNAMES: "admin"
        run: |
          python -m pytest -v tests/test_e2e_browser.py | tee e2e_results.log

      - name: Report E2E failure
        if: failure() && steps.e2e_step.outcome == 'failure'
        run: |
          echo '### ❌ Browser E2E Failure Details' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 e2e_results.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
