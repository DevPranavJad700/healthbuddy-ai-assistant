name: CI-CD

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit ruff cyclonedx-bom

      - name: Generate SBOM
        run: |
          cyclonedx-py requirements -i requirements.txt -o sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Lint gate
        run: |
          python -m ruff check app tests --select E9,F63,F7,F82

      - name: Run tests
        run: |
          python -m pytest tests -v

      - name: Security scan (Bandit)
        run: |
          python -m bandit -r app -x tests -ll

      - name: Dependency vulnerability scan
        continue-on-error: true
        run: |
          pip-audit

  build-image:
    runs-on: ubuntu-latest
    needs: test-and-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t healthbuddy-ai:${{ github.sha }} .

      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: healthbuddy-ai:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "0"

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start API
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --app-dir . &
          sleep 8

      - name: Smoke checks (health/chat/auth)
        run: |
          python tests/smoke_post_deploy.py

      - name: Clinical benchmark gate
        env:
          QUALITY_GATE_PROFILE: baseline
        run: |
          python evaluation/quality_benchmark.py --base-url http://127.0.0.1:8000 --test-data ./evaluation/clinical_benchmark_gold.json --output ./evaluation/clinical_quality_report.json --timeout 120
          python evaluation/quality_gate.py --report ./evaluation/clinical_quality_report.json --profile-file ./evaluation/threshold_profiles.json --threshold-file ./evaluation/thresholds_clinical.json

      - name: Language benchmark gates (HI/ES/AR)
        env:
          QUALITY_GATE_PROFILE: baseline
        run: |
          python evaluation/quality_benchmark.py --base-url http://127.0.0.1:8000 --test-data ./evaluation/test_queries_hi.json --output ./evaluation/quality_report_hi.json --timeout 120
          python evaluation/quality_gate.py --report ./evaluation/quality_report_hi.json --profile-file ./evaluation/threshold_profiles.json --threshold-file ./evaluation/thresholds_hi.json
          python evaluation/quality_benchmark.py --base-url http://127.0.0.1:8000 --test-data ./evaluation/test_queries_es.json --output ./evaluation/quality_report_es.json --timeout 120
          python evaluation/quality_gate.py --report ./evaluation/quality_report_es.json --profile-file ./evaluation/threshold_profiles.json --threshold-file ./evaluation/thresholds_es.json
          python evaluation/quality_benchmark.py --base-url http://127.0.0.1:8000 --test-data ./evaluation/test_queries_ar.json --output ./evaluation/quality_report_ar.json --timeout 120
          python evaluation/quality_gate.py --report ./evaluation/quality_report_ar.json --profile-file ./evaluation/threshold_profiles.json --threshold-file ./evaluation/thresholds_ar.json

      - name: Clinical KPI release gate
        run: |
          python evaluation/gate_clinical_kpis.py --report ./evaluation/clinical_quality_report.json --thresholds ./evaluation/clinical_kpi_thresholds.json

      - name: Fairness and adversarial checks
        run: |
          python evaluation/evaluate_fairness.py --base-url http://127.0.0.1:8000 --cases ./evaluation/fairness_cases.json --output ./evaluation/fairness_report.json
          python evaluation/evaluate_adversarial.py --base-url http://127.0.0.1:8000 --cases ./evaluation/adversarial_redteam_cases.json --output ./evaluation/adversarial_report.json

  browser-e2e:
    runs-on: ubuntu-latest
    needs: test-and-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run browser E2E tests
        env:
          RUN_E2E: "1"
        run: |
          python -m pytest -v tests/test_e2e_browser.py
